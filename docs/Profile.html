<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Nakatani — Профиль</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="images/Nakatani.png" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f7f7f7;
      color: #353535;
    }

    .container {
      display: flex;
      max-width: 90%;
      margin: 100px auto;
      background-color: #fff;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      overflow: hidden;
      width: 80%;
      height: 80%;
    }

    .sidebar {
      width: 280px;
      background-color: #343a40;
      padding: 40px 25px;
      color: #fff;
    }

    .sidebar button {
      width: 100%;
      margin-bottom: 15px;
      padding: 12px;
      background-color: #495057;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .sidebar button:hover {
      background-color: #6d6d6d;
    }

    .content {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
      max-height: 80vh;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .form-group {
      margin-bottom: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
      color: rgb(0, 0, 0);
    }

    .readonly-field {
      padding: 10px;
      background-color: #ffffff;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .logout-btn {
      padding: 12px 20px;
      background-color: #dc3545;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .logout-btn:hover {
      background-color: #c82333;
    }

    .order-item {
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      transition: transform 0.2s ease;
      max-width: 100%;
      overflow-x: auto;
    }

    .order-item:hover {
      transform: translateY(-2px);
    }

    .order-item ul {
      list-style-type: disc;
      padding-left: 20px;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        margin: 10px;
      }

      .sidebar {
        width: 100%;
        text-align: center;
        padding: 20px;
      }

      .content {
        padding: 20px;
      }

      .navbar-left, .navbar-right {
        display: none;
      }

      .navbar-center {
        margin: 0 auto;
      }
    }

    footer {
      background-color: #333;
      color: #fff;
      text-align: center;
      padding: 10px;
    }

    footer p {
      margin: 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<header>
    <nav>
        <ul class="navbar">
            <div class="navbar-left">
                <li><a href="login_register.html" class="button">Вход</a></li>
                <li><a href="Profile.html" class="button">Профиль</a></li>
                <li><a href="index.html" class="button">Главная</a></li>
            </div>
            <div class="navbar-center">
                <img src="images/Nakatani.png" alt="Логотип Nakatani" class="navbar-logo">
            </div>
            <div class="navbar-right">
                <li><a href="menu.html" class="button">Меню</a></li>
                <li><a href="Delivery terms.html" class="button">Условия доставки</a></li>
                <!-- Кнопка корзины в шапке -->
                <button id="cart-button" class="cart-button">
                    Корзина (<span id="cartCount">0</span>)
                </button>

                <!-- Модальное окно корзины -->
                <div id="cartModal" class="modal">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h2>Ваша корзина</h2>
                            <span class="close" id="closeCart">&times;</span>
                        </div>
                        <div class="modal-body">
                            <div id="cartContent" class="cart-items">
                                <div class="empty-cart">Корзина пуста</div>
                            </div>
                            <div class="cart-total">
                                 <span id="cartTotal">0</span>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <a href="checkout.html" class="checkout-button">Оформить заказ</a>
                        </div>
                    </div>
                </div>
            </div>
        </ul>
    </nav>
</header>

<div class="container">
  <div class="sidebar">
    <button id="account-btn">Учётная запись</button>
    <button id="orders-btn">История заказов</button>
    <button id="logout-btn" class="logout-btn">Выйти</button>
  </div>

  <div class="content">
    <div id="account" class="section active">
      <h2>Учётная запись</h2>
      <div class="form-group">
        <label><strong>Имя пользователя:</strong></label>
        <p id="profile-username" class="readonly-field"></p>
      </div>
      <div class="form-group">
        <label for="profile-bio"><strong>О себе:</strong></label>
        <textarea id="profile-bio" rows="4" placeholder="Расскажите о себе..."></textarea>
      </div>
      <div class="form-group">
        <label><strong>Дата регистрации:</strong></label>
        <p id="profile-reg-date" class="readonly-field"></p>
      </div>
      <button id="saveProfileBtn">Сохранить</button>
    </div>

    <div id="orders" class="section">
      <h2>История заказов</h2>
      <div id="orderHistory"></div>
    </div>
  </div>
</div>

<footer>
  <p>&copy; 2025 Nakatani. Все права защищены.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
